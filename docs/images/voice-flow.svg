<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 0 800 290" role="img" aria-labelledby="title desc">
  <title id="title">Local Voice conversation flow</title>
  <desc id="desc">Parakeet transcribes your speech on your Mac. Choose local Qwen or cloud ChatGPT for the answer. Kokoro speaks the reply locally.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9faebb"/>
    </marker>
  </defs>
  <rect width="800" height="290" rx="16" fill="#101820"/>
  <g fill="none" stroke="#9faebb" stroke-width="2" marker-end="url(#arrow)">
    <path d="M244 145 H278 V72 H318"/>
    <path d="M278 145 V218 H318"/>
    <path d="M480 72 H518 V145 H554"/>
    <path d="M480 218 H518 V145" marker-end="none"/>
  </g>
  <g fill="#1c2b35" stroke="#76e0ba" stroke-width="1.5">
    <rect x="24" y="90" width="220" height="110" rx="12"/>
    <rect x="320" y="24" width="160" height="96" rx="12"/>
    <rect x="320" y="170" width="160" height="96" rx="12" stroke="#8bb8f8"/>
    <rect x="556" y="90" width="220" height="110" rx="12"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#f0f6fc">
    <text x="134" y="122" font-size="22" font-weight="700">You speak</text>
    <text x="134" y="151" font-size="18">Parakeet STT</text>
    <text x="134" y="178" font-size="16" fill="#b9c7d2">On your Mac</text>
    <text x="400" y="64" font-size="21" font-weight="700">Local Qwen</text>
    <text x="400" y="91" font-size="16" fill="#b9c7d2">On your Mac</text>
    <text x="400" y="210" font-size="21" font-weight="700">ChatGPT</text>
    <text x="400" y="237" font-size="16" fill="#b9c7d2">Cloud</text>
    <text x="666" y="122" font-size="22" font-weight="700">You hear the reply</text>
    <text x="666" y="151" font-size="18">Kokoro voice</text>
    <text x="666" y="178" font-size="16" fill="#b9c7d2">On your Mac</text>
  </g>
</svg>
